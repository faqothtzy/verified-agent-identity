name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          # Caching membantu mempercepat workflow berikutnya
          cache: 'npm'
          cache-dependency-path: './scripts/package-json.lock' # sesuaikan jika ada lock file

      - name: Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install and Run Scripts
        working-directory: ./scripts
        run: |
          npm install
          node createNewEthereumIdentity.js
          node manualLinkHumanToAgent.js --challenge '{"name":"faqothtzy","description":"AI Agent"}'
