name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Nama Agent'
        required: true
        default: 'faqothtzy'
      agent_description:
        description: 'Deskripsi Agent'
        required: true
        default: 'faqothtzy AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        working-directory: ./scripts
        run: npm install

      - name: Step 2 - Create new Ethereum Identity
        working-directory: ./scripts
        run: node createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        working-directory: ./scripts
        run: node manualLinkHumanToAgent.js --challenge '{"name": "${{ github.event.inputs.agent_name }}", "description": "${{ github.event.inputs.agent_description }}"}'
