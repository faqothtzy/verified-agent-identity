name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        working-directory: ./scripts
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Step 2 - Create new Ethereum Identity
        working-directory: ./scripts
        run: node createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        working-directory: ./scripts
        run: node manualLinkHumanToAgent.js --challenge '{"name":"faqothtzy","description":"faqothtzy AI Agent"}'
