name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install Deps and Create ID
        working-directory: ./scripts
        run: |
          npm install
          node createNewEthereumIdentity.js

      - name: Link Identity
        working-directory: ./scripts
        run: node manualLinkHumanToAgent.js --challenge '{"name":"faqothtzy","description":"faqothtzy AI Agent"}'
